name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, mbstring
          coverage: none

      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP
        run: find src public bin templates tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Check JavaScript syntax
        run: for f in public/assets/js/*.js public/assets/js/core/*.js; do node --check "$f"; done

      - name: Static analysis (PHPStan level 8)
        run: composer analyse

      - name: Tests
        run: composer test

  mysql:
    name: PHP 8.3 · ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - { name: 'MySQL 8.4', image: 'mysql:8.4' }
          - { name: 'MariaDB 11.4', image: 'mariadb:11.4' }

    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret || mariadb-admin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=30

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, curl, mbstring
          coverage: none

      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Feature tests against ${{ matrix.database.name }}
        run: vendor/bin/phpunit --testsuite Feature
