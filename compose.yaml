# Full stack with MySQL:   docker compose up --build   →   http://localhost:8000
# (Without Docker the app uses SQLite and needs no database server at all.)

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: keystone
      DB_USERNAME: keystone
      DB_PASSWORD: keystone
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: keystone
      MYSQL_USER: keystone
      MYSQL_PASSWORD: keystone
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukeystone", "-pkeystone"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
